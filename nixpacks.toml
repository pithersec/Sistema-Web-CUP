[phases.setup]
nixPkgs = ["php82", "php82Extensions.gd", "php82Extensions.zip", "php82Extensions.mbstring"]

[phases.build]
cmds = ["composer install --no-dev", "php artisan config:cache", "php artisan route:cache", "php artisan migrate --force"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"